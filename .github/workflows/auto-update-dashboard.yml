name: Auto-update academic dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Show repository files
        run: |
          pwd
          ls -la
          echo "---- workflow folder ----"
          ls -la .github/workflows || true
          echo "---- python version ----"
          python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secret
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUSAPIKEY }}
        run: |
          if [ -z "$SCOPUS_API_KEY" ]; then
            echo "ERROR: SCOPUSAPIKEY secret is missing or workflow is not reading it."
            exit 1
          fi
          echo "SCOPUSAPIKEY secret exists."

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update dashboard data from Scopus and OpenAlex
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUSAPIKEY }}
          SCOPUS_AUTHOR_ID: "55877289000"
          ORCID_ID: "0000-0002-4978-1499"
          OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEXAPIKEY }}
          GIT_AUTO_PUSH: "1"
          GIT_BRANCH: "main"
        run: |
          python auto_sync_dashboard.py --data dashboard_data.json --out-js dashboard_data.js --verbose
